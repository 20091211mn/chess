<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#262522"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><title>PS4 Chess</title>
<style>
:root{--bg:#262522;--panel:#2b2926;--card:#21201d;--line:#3d3a37;--txt:#fff;--sub:#bababa;--mut:#8b8987;--grn:#81b64c;--grnd:#5d8a3a;--lt:#ebecd0;--dk:#779556;--red:#e04e46}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;padding:6px 6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;min-height:100%}
#app>*+*{margin-top:6px}
.player{display:flex;align-items:center;background:var(--panel);border-radius:10px;padding:6px 10px;min-height:54px}
.avatar{margin-right:10px;width:40px;height:40px;border-radius:8px;background:var(--dk);display:flex;align-items:center;justify-content:center;flex:none}
.avatar svg{width:34px;height:34px}
.pinfo{flex:1;min-width:0;margin-right:10px}.name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{height:20px;display:flex;align-items:center;font-size:12px;color:var(--sub)}.cap svg{width:18px;height:18px;margin-right:-7px}.cap b{margin-left:12px;font-weight:600}
.clock{font:600 22px ui-monospace,Menlo,Consolas,monospace;background:var(--card);border-radius:8px;padding:5px 12px;min-width:88px;text-align:center;flex:none}
.clock.on{background:#fff;color:#262522}.clock.low{background:var(--red);color:#fff}
#wrap{display:flex;align-items:stretch}
#ev{margin-right:6px;width:16px;border-radius:6px;background:#46433f;position:relative;overflow:hidden;flex:none}
#evf{position:absolute;left:0;right:0;bottom:0;background:#f5f5f5;height:50%;transition:height .35s ease}
#evt{position:absolute;left:0;right:0;font-size:9px;font-weight:700;text-align:center;line-height:1}
#boardbox{flex:1;min-width:0}
#board{position:relative;width:100%;height:0;padding-bottom:100%;border-radius:6px;overflow:hidden;touch-action:none;background:var(--dk)}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq.last::before,.sq.sel::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(255,255,51,.5)}.sq.sel::before{background:rgba(20,110,40,.5)}
.sq.hov{box-shadow:inset 0 0 0 4px rgba(255,255,255,.7)}
.sq.chk{background:radial-gradient(circle,#ff2a2a 0,#e83a3a 38%,rgba(230,50,50,0) 78%)!important}
.dot{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:rgba(20,85,0,.32)}
.ring{position:absolute;left:3%;top:3%;right:3%;bottom:3%;border-radius:50%;border:5px solid rgba(20,85,0,.32)}
.crd{position:absolute;font-size:10px;font-weight:600;line-height:1}.crd.f{right:3px;bottom:2px}.crd.r{left:3px;top:2px}
.l .crd{color:var(--dk)}.d .crd{color:var(--lt)}
.pc{position:absolute;width:12.5%;height:12.5%;pointer-events:none;transition:left .17s ease,top .17s ease;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.38))}
.pc svg{width:100%;height:100%}.pc.ghostsrc{opacity:.3}
#ghost{position:fixed;width:80px;height:80px;pointer-events:none;z-index:20;transform:translate(-50%,-62%);filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
#status{color:#fff;text-align:center;padding:9px;background:var(--panel);border-radius:10px;font-weight:600;font-size:15px;min-height:40px}
#status.win{color:#ffcd00}
#moves{background:var(--panel);border-radius:10px;padding:6px 8px;font-size:14px;display:flex;overflow-x:auto;white-space:nowrap;color:var(--mut);min-height:36px;align-items:center;scrollbar-width:none}
#moves::-webkit-scrollbar{display:none}
#moves span{flex:none;margin-right:8px}#moves i{font-style:normal;color:#6b6a67;margin-right:3px}#moves b{font-weight:600;color:var(--txt);padding:2px 5px;border-radius:5px}#moves b.cur{background:var(--grnd)}
.row{display:flex}.row>*+*{margin-left:6px}
button{flex:1;background:#454340;color:var(--txt);border:0;border-radius:10px;padding:12px 4px;font:600 14px inherit;font-family:inherit}
button:active{background:#5a5855}button.red{background:#7a2c2c}button.grn{background:var(--grn);color:#fff}button.sm{padding:9px 4px;font-size:18px;background:var(--panel)}
button:disabled{opacity:.35}
#drawbar{display:none;background:var(--panel);border-radius:10px;padding:10px;align-items:center}#drawbar>*+*{margin-left:8px}
#drawbar span{flex:1;font-weight:600;font-size:14px}#drawbar button{flex:none;padding:9px 14px}
#promo,#over{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:30}
#promoBox{background:var(--panel);border-radius:14px;padding:14px;display:flex}#promoBox>*+*{margin-left:10px}
#promoBox div{width:68px;height:68px;border-radius:10px;background:var(--dk);display:flex;align-items:center;justify-content:center}#promoBox svg{width:60px;height:60px}
#overBox{background:var(--panel);border-radius:16px;padding:22px;width:86vw;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#overBox h2{margin:0 0 4px;font-size:26px}#overBox p{margin:0 0 16px;color:var(--sub)}#overBox .row{margin-top:8px}
#conn{position:fixed;top:0;left:0;right:0;text-align:center;font-size:13px;padding:5px;background:var(--red);color:#fff;z-index:40;display:none}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#14130f;color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;z-index:35;display:none}
</style></head><body>

  var botList=bot==="w"?byW:byB,topList=bot==="w"?byB:byW,advBot=bot==="w"?sc:-sc;
  $("botCap").innerHTML=capHtml(botList,advBot);$("topCap").innerHTML=capHtml(topList,-advBot);
  $("botAv").innerHTML=pieceSvg(bot==="w"?"K":"k");$("topAv").innerHTML=pieceSvg(top==="w"?"K":"k");
  var me=S.you;
  $("botName").textContent=me===bot?"You":(me==="s"?(bot==="w"?"White":"Black"):"PS4");
  $("topName").textContent=me===top?"You":(me==="s"?(top==="w"?"White":"Black"):"PS4");
}
function status(){
  var st=$("status"),t="";st.className="";
  if(!live())t="Reviewing move "+viewPly+" of "+S.plies;
  else if(S.res){var w={1:"White",2:"Black"}[S.res];t=S.res===3?"Draw - "+S.reason:(S.you==="s"?w+" won":((S.res===1)===(S.you==="w")?"You won":"You lost"))+" - "+S.reason;st.className="win"}
  else if(S.err&&S.err!=="spectator")t=S.err;
  else if(S.you==="s")t=(S.turn==="w"?"White":"Black")+" to move (spectating)";
  else if(S.draw===mySide())t="Draw offer sent";
  else if(S.turn===S.you)t=(S.check?"Check! ":"")+"Your move";
  else t=(S.check?"Check! ":"")+"Waiting for PS4…";
  st.textContent=t;
}
function moves(){
  var mv=$("moves"),h="",cur=live()?S.san.length-1:viewPly-1;
  for(var i=0;i<S.san.length;i++){if(i%2===0)h+="<span><i>"+(i/2+1)+".</i>";h+='<b'+(i===cur?' class="cur"':'')+'>'+S.san[i]+"</b>";if(i%2===1)h+="</span>"}
  if(S.san.length%2===1)h+="</span>";
  if(!S.san.length)h='<span style="color:#6b6a67">No moves yet</span>';
  mv.innerHTML=h;mv.scrollLeft=mv.scrollWidth;
}
function fmt(ms){if(ms<0)return"--:--";var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);s%=60;return m+":"+(s<10?"0":"")+s}
function clocks(){
  if(!S)return;var bot=isFlipped()?"b":"w",wt=S.wt,bt=S.bt;
  var botMs=bot==="w"?wt:bt,topMs=bot==="w"?bt:wt,run=!S.res&&S.plies>0&&wt>=0&&live();
  var onBot=run&&S.turn===bot,onTop=run&&S.turn!==bot;
  $("botClock").textContent=fmt(botMs);$("topClock").textContent=fmt(topMs);
  $("botClock").className="clock"+(onBot?" on":"")+(botMs>=0&&botMs<20000?" low":"");
  $("topClock").className="clock"+(onTop?" on":"")+(topMs>=0&&topMs<20000?" low":"");
}
function evalBar(){
  var ev=$("ev");if(typeof S.ev!=="number"){ev.style.display="none";return}ev.style.display="";
  var cp=S.res===1?30000:S.res===2?-30000:S.ev,f=1/(1+Math.exp(-Math.max(-3000,Math.min(3000,cp))/280));
  var whiteBottom=!isFlipped(),f1=$("evf");
  f1.style.height=(f*100)+"%";f1.style.top=whiteBottom?"auto":"0";f1.style.bottom=whiteBottom?"0":"auto";
  var t=$("evt");t.textContent=Math.abs(cp)>=29000?"M":(Math.abs(cp)/100).toFixed(1);
  var whiteAhead=cp>=0,atBottom=whiteAhead===whiteBottom;t.style.top=atBottom?"auto":"4px";t.style.bottom=atBottom?"4px":"auto";t.style.color=whiteAhead?"#262522":"#eee";
}
function buttons(){
  var spec=S.you==="s",over=!!S.res;
  $("resign").disabled=over||spec;$("draw").disabled=over||spec||S.draw>=0;
  $("draw").textContent=S.draw===mySide()?"½ Offered":"½ Draw";
  $("nFirst").disabled=$("nPrev").disabled=S.plies<1||(viewPly===0);
  $("nNext").disabled=$("nLast").disabled=live();
  var db=$("drawbar"),offer=!over&&S.draw>=0&&S.draw!==mySide()&&!spec;
  db.style.display=offer?"flex":"none";if(offer)$("drawtxt").textContent="PS4 offers a draw";
  var ov=$("over");
  if(over&&live()&&!spec&&lastKey!=="x"+S.plies+S.res){lastKey="x"+S.plies+S.res;
    $("overT").textContent=S.res===3?"Draw":((S.res===1)===(S.you==="w")?"You won!":"You lost");$("overP").textContent=S.reason;ov.style.display="flex"}
  if(!over)ov.style.display="none";
}

// ---------- sound & haptics
function unlock(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioCtx=audioCtx||new A();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function tone(f,d,type,vol,when){try{if(!audioCtx)return;var t=audioCtx.currentTime+(when||0),o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function sound(k){
  if(k==="move"){tone(330,.07,"triangle",.09)}else if(k==="capture"){tone(200,.09,"square",.07);tone(130,.12,"triangle",.09,.02)}
  else if(k==="check"){tone(660,.1,"sine",.09);tone(880,.16,"sine",.09,.1)}else if(k==="castle"){tone(330,.06,"triangle",.09);tone(330,.06,"triangle",.09,.09)}
  else if(k==="end"){[440,554,659].forEach(function(f,i){tone(f,.5,"sine",.07,i*.02)})}else if(k==="illegal"){tone(110,.12,"sawtooth",.05)}else if(k==="notify"){tone(740,.08,"sine",.07);tone(990,.1,"sine",.07,.09)}
}
function buzz(n){try{if(navigator.vibrate)navigator.vibrate(n||20)}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display="none"},2200)}

// ---------- input: tap-tap and drag & drop
function sqFromEvent(e){
  var r=boardEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  if(x<0||x>=1||y<0||y>=1)return null;var fl=isFlipped(),f=Math.floor(x*8),rk=Math.floor(y*8);
  return sqName(fl?7-f:f,fl?rk:7-rk)}
function attempt(from,to){
  var c=S.legal.filter(function(m){return m.substr(0,4)===from+to});
  if(!c.length){sound("illegal");return false}
  if(c.length>1&&c[0].length===5){askPromo(from,to);return true}
  send("move "+c[0]);sel=null;return true}
function askPromo(from,to){
  var box=$("promoBox");box.innerHTML="";
  ["q","r","b","n"].forEach(function(t){var d=document.createElement("div");d.innerHTML=pieceSvg(S.you==="w"?t.toUpperCase():t);
    d.onclick=function(){$("promo").style.display="none";send("move "+from+to+t);sel=null;render()};box.appendChild(d)});
  $("promo").style.display="flex"}
function ghostEl(){var g=$("ghost");if(!g){g=document.createElement("div");g.id="ghost";document.body.appendChild(g)}return g}
boardEl.addEventListener("pointerdown",function(e){
  unlock();if(!canMove())return;var sq=sqFromEvent(e);if(!sq)return;
  if(sel&&sel!==sq&&legalFrom(sel).some(function(m){return m.substr(2,2)===sq})){drag=null;attempt(sel,sq);render();return}
  var b=parseFen(S.fen),pc=b[sq];
  if(pc&&((pc===pc.toUpperCase())===(S.you==="w"))&&legalFrom(sq).length){
    var again=sel===sq;sel=sq;drag={from:sq,x:e.clientX,y:e.clientY,moved:false,again:again,piece:pc};
    try{if(boardEl.setPointerCapture)boardEl.setPointerCapture(e.pointerId)}catch(x){}
    render()}
  else{sel=null;drag=null;render()}
});
boardEl.addEventListener("pointermove",function(e){
  if(!drag)return;
  if(!drag.moved&&Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>6){drag.moved=true;var g=ghostEl();g.innerHTML=pieceSvg(drag.piece);g.style.display="block";render()}
  if(drag.moved){var g2=ghostEl();g2.style.left=e.clientX+"px";g2.style.top=e.clientY+"px";
    var h=sqFromEvent(e),all=boardEl.querySelectorAll(".sq");for(var i=0;i<all.length;i++)all[i].classList.remove("hov");if(h)$("s_"+h).classList.add("hov")}
});
function endDrag(e){
  if(!drag)return;var d=drag;drag=null;var g=$("ghost");if(g)g.style.display="none";
  var to=sqFromEvent(e);
  if(d.moved){if(to&&to!==d.from){if(!attempt(d.from,to)){}}else{}}
  else if(d.again){sel=null}
  render();
}
boardEl.addEventListener("pointerup",endDrag);
boardEl.addEventListener("pointercancel",function(){drag=null;var g=$("ghost");if(g)g.style.display="none";render()});

// ---------- history review
function nav(k){
  if(!S||S.plies<1)return;
  if(!H||H.n!==S.plies){pendingNav=k;send("hist");return}
  var cur=live()?S.plies:viewPly,n=cur;
  if(k==="first")n=0;else if(k==="prev")n=cur-1;else if(k==="next")n=cur+1;else n=S.plies;
  n=Math.max(0,Math.min(S.plies,n));viewPly=n===S.plies?null:n;sel=null;render()}
$("nFirst").onclick=function(){nav("first")};$("nPrev").onclick=function(){nav("prev")};$("nNext").onclick=function(){nav("next")};$("nLast").onclick=function(){nav("last")};
$("flip").onclick=function(){manualFlip=true;flipped=!isFlipped();render()};
$("resign").onclick=function(){if(confirm("Resign this game?"))send("resign")};
$("draw").onclick=function(){send("draw");toast("Draw offer sent")};
$("dyes").onclick=function(){send("draw_yes")};$("dno").onclick=function(){send("draw_no")};
$("again").onclick=function(){send("new");$("over").style.display="none"};$("closeOver").onclick=function(){$("over").style.display="none"};
$("promo").addEventListener("click",function(e){if(e.target.id==="promo")$("promo").style.display="none"});

setInterval(function(){
  if(!S||S.wt<0||S.res||S.plies<1)return;
  var now=Date.now(),dt=lastTick?now-lastTick:0;lastTick=now;
  if(S.turn==="w")S.wt=Math.max(0,S.wt-dt);else S.bt=Math.max(0,S.bt-dt);clocks()},250);

// ---------- connection with heartbeat + reconnect
function send(m){if(ws&&ws.readyState===1)ws.send(m)}
function connect(){
  $("conn").style.display="block";
  try{ws=new WebSocket("ws://"+location.host+"/ws")}catch(e){setTimeout(connect,backoff);return}
  var mine=ws;
  ws.onopen=function(){backoff=800;lastRx=Date.now();$("conn").style.display="none";send("hello");clearInterval(hbTimer);
    hbTimer=setInterval(function(){if(mine!==ws)return;send("ping");if(Date.now()-lastRx>11000){try{ws.close()}catch(e){}}},4000)};
  ws.onclose=function(){if(mine!==ws)return;$("conn").style.display="block";$("conn").textContent="Reconnecting to PS4…";setTimeout(connect,backoff);backoff=Math.min(3000,backoff*1.6)};
  ws.onerror=function(){try{ws.close()}catch(e){}};
  ws.onmessage=function(ev){
    lastRx=Date.now();var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==="hist"){H=m;if(pendingNav){var k=pendingNav;pendingNav=null;nav(k)}return}
    if(m.t!=="state")return;
    var prev=S,fenChanged=!prev||m.fen!==prev.fen;
    if(prev&&(m.plies<prev.plies||(m.plies===0&&prev.plies>0))){manualFlip=false;sel=null;boardEl.dataset.fl="";pieceEls={};H=null;viewPly=null;lastKey=""}
    if(!prev||prev.you!==m.you){manualFlip=false;boardEl.dataset.fl=""}
    S=m;lastTick=Date.now();
    if(fenChanged){sel=null;if(viewPly!==null){viewPly=null}
      if(prev&&m.plies>prev.plies){var s=m.san[m.san.length-1]||"";
        sound(m.res?"end":/[+#]/.test(s)?"check":/^O-O/.test(s)?"castle":/x/.test(s)?"capture":"move");buzz(15)}}
    if(prev&&prev.draw!==m.draw&&m.draw>=0&&m.draw!==mySide()){sound("notify");buzz([30,40,30])}
    if(prev&&prev.draw>=0&&m.draw<0&&!m.res&&prev.draw===mySide())toast("PS4 declined the draw");
    if(m.err&&m.err!=="spectator"&&/illegal|not your/.test(m.err)){sound("illegal");buzz(60)}
    render();
  };
}
buildSymbols();
if(navigator.wakeLock&&navigator.wakeLock.request){try{navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&ws&&ws.readyState!==1){try{ws.close()}catch(e){}}});
connect();
})();
