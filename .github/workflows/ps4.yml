name: ps4-pkg
on:
  workflow_dispatch:
  push:
jobs:
  pkg:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Download OpenOrbis toolchain
        run: |
          mkdir -p toolchain && cd toolchain
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz'
          tar -xzf *.tar.gz
          chmod -R +x bin || true
      - name: Prepare chess from SDL sample
        run: |
          D=$(find toolchain/samples -maxdepth 1 -type d -ipath '*sdl*' | head -1)
          echo "Sample: $D"; find "$D" -maxdepth 2 | head -40
          cp -r "$D" build
          M=$(find build -type f \( -name 'main.c' -o -name 'main.cpp' \) | head -1)
          echo "Main: $M"
          cp ps4/main.c "$M"
          cp ps4/chess_engine.h "$(dirname "$M")/"
      - name: Icon
        run: |
          I=$(find "$PROJ" -name icon0.png | head -1)
          echo "icon: $I"; cp ps4/icon0.png "$I"
      - name: Build PKG
        run: |
          cd build && make
          find . -name '*.pkg'
      - uses: actions/upload-artifact@v4
        with:
          name: chess-ps4-pkg
          path: build/**/*.pkg
