name: ps4-pkg
on:
  workflow_dispatch:
  push:
jobs:
  pkg:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm unzip
      - name: Download OpenOrbis toolchain
        run: |
          mkdir -p tc && cd tc
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*'
          for f in *.zip; do [ -e "$f" ] && unzip -oq "$f"; done
          for f in *.tar.gz; do [ -e "$f" ] && tar -xzf "$f"; done
          S=$(find "$PWD" -maxdepth 3 -type d -name samples | head -1)
          ROOT=$(dirname "$S")
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV
          chmod -R +x "$ROOT/bin" || true
      - name: Prepare chess from SDL sample
        run: |
          D=$(find "$OO_PS4_TOOLCHAIN/samples" -maxdepth 1 -type d -ipath '*sdl*' | head -1)
          N=$(basename "$D")
          mkdir -p work && cp -r "$D" "work/$N"
          echo "PROJ=work/$N" >> $GITHUB_ENV
          echo "=== tree ==="; find "work/$N" -maxdepth 3 | head -60
          echo "=== Makefile ==="; sed -n 1,70p "work/$N/Makefile"
          if [ -d "work/$N/$N" ]; then T="work/$N/$N"; else T="work/$N"; fi
          echo "Target dir: $T"
          find "$T" -maxdepth 1 -type f \( -name '*.c' -o -name '*.cpp' \) -delete
          { echo '#include <sstream>'; echo 'std::stringstream debugLogStream;'; cat ps4/main.c; } > "$T/main.cpp"
          cp ps4/chess_engine.h "$T/"
      - name: Icon
        run: |
          I=$(find "$PROJ" -name icon0.png | head -1)
          echo "icon: $I"; cp ps4/icon0.png "$I"
      - name: Build PKG
        run: |
          cd "$PROJ" && make
          find . -name '*.pkg'
      - uses: actions/upload-artifact@v4
        with:
          name: chess-ps4-pkg
          path: work/**/*.pkg
