name: ps4-pkg
on:
  workflow_dispatch:
  push:
jobs:
  pkg:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Download OpenOrbis toolchain
        run: |
          mkdir -p toolchain && cd toolchain
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz'
          tar -xzf *.tar.gz
          chmod -R +x bin || true
          ls
      - name: Build hello_world sample
        run: |
          cd toolchain/samples/hello_world
          make
          find . -name '*.pkg'
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: toolchain/samples/hello_world/**/*.pkg
