name: ps4-pkg
on:
  workflow_dispatch:
  push:
jobs:
  pkg:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm unzip
      - name: Download OpenOrbis toolchain
        run: |
          mkdir -p tc && cd tc
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*'
          ls -la
          for f in *.zip; do [ -e "$f" ] && unzip -oq "$f"; done
          for f in *.tar.gz; do [ -e "$f" ] && tar -xzf "$f"; done
          S=$(find "$PWD" -maxdepth 3 -type d -name samples | head -1)
          ROOT=$(dirname "$S")
          echo "Toolchain root: $ROOT"; ls "$ROOT"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV
          chmod -R +x "$ROOT/bin" || true
      - name: Prepare chess from SDL sample
        run: |
          ls "$OO_PS4_TOOLCHAIN/samples"
          D=$(find "$OO_PS4_TOOLCHAIN/samples" -maxdepth 1 -type d -ipath '*sdl*' | head -1)
          echo "Sample: $D"; find "$D" -maxdepth 2 | head -40
          cp -r "$D" build
          M=$(find build -type f \( -name 'main.c' -o -name 'main.cpp' \) | head -1)
          echo "Main: $M"
          cp ps4/main.c "$M"
          cp ps4/chess_engine.h "$(dirname "$M")/"
      - name: Build PKG
        run: |
          cd build && make
          find . -name '*.pkg'
      - uses: actions/upload-artifact@v4
        with:
          name: chess-ps4-pkg
          path: build/**/*.pkg
